[package]
name = "velowa-wasm-voip"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wasm-bindgen bridge for the vendored call stack: relay parsing, E2E-SRTP/WARP/STUN media engine, MLow audio"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wacore-voip = { workspace = true }
wacore-binary = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["alloc"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
rand = { workspace = true }
console_error_panic_hook = "0.1"
anyhow = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
rtc-datachannel = { version = "=0.21.0-beta.2" }
rtc-dtls = { version = "=0.21.0-beta.2", default-features = false, features = ["crypto-ring"] }
rtc-sctp = { version = "=0.21.0-beta.2" }
rtc-shared = { version = "=0.21.0-beta.2", default-features = false }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { version = "1", features = ["web"] }
