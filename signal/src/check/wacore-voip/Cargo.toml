[package]
name = "wacore-voip"
version.workspace = true
edition.workspace = true
license = "MIT" # vendored from oxidezap/whatsapp-rust; see THIRD_PARTY_NOTICES.md
repository.workspace = true
description = "Sans-IO WhatsApp call stack (stanzas, relay, SRTP/SFrame, MLow, call engine), vendored from wacore's voip modules"
publish = false

[features]
default = ["voip-mlow"]
voip-control = []
voip = ["voip-control"]
voip-mlow = ["voip"]

[dependencies]
wacore-binary = { workspace = true, features = ["serde"] }
wacore-libsignal = { workspace = true }
waproto = { workspace = true }
wacore-derive = { workspace = true }
aes = { workspace = true }
aes-gcm = { version = "0.11.0", default-features = false, features = ["aes", "alloc", "bytes"] }
anyhow = { workspace = true }
async-channel = { version = "2.5.0", default-features = false, features = ["std"] }
async-lock = { workspace = true }
event-listener = { version = "5", default-features = false, features = ["std"] }
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await", "std"] }
async-trait = { workspace = true }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
bon = { version = "3.9.3", default-features = false, features = ["std"] }
buffa = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["now", "serde"] }
ctr = { workspace = true }
hex = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
log = { workspace = true }
portable-atomic = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
sha1 = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
zerocopy = { version = "0.8.55", default-features = false, features = ["derive"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }

[build-dependencies]
buffa-build = { workspace = true }
