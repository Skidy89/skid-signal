[package]
name = "signal"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"
members = [
  "src/check/wacore-appstate",
  "src/check/wacore-binary",
  "src/check/wacore-derive",
  "src/check/wacore-libsignal",
  "src/check/wacore-noise",
  "src/check/wacore-voip",
  "src/check/waproto",
]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Skidy89/skid-signal"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "allow"

[workspace.dependencies]
aes = "0.9.2"
anyhow = { version = "1.0", default-features = false }
async-lock = { version = "3", default-features = false }
async-trait = "0.1.91"
buffa = { version = "0.9.2", default-features = false, features = ["json"] }
buffa-build = { version = "0.9.2", default-features = false }
buffa-descriptor = { version = "0.9.2", default-features = false }
bytes = { version = "1.12", default-features = false }
cbc = { version = "0.2", features = ["alloc"] }
chrono = { version = "0.4", default-features = false }
compact_str = { version = "0.10", default-features = false }
ctr = { version = "0.10", default-features = false }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
futures = { version = "0.3", default-features = false, features = ["alloc", "async-await"] }
getrandom = { version = "0.4", default-features = false }
heck = "0.5"
hex = "0.4"
hkdf = { version = "0.13.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
itoa = "1"
log = "0.4"
portable-atomic = "1"
rand = "0.10"
serde = { version = "1.0", features = ["derive", "rc"] }
serde-big-array = "0.5"
serde_json = "1"
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
smallvec = "1"
smoothutf8 = { version = "0.2.3", default-features = false }
subtle = "2"
thiserror = "2"
wacore-appstate = { path = "src/check/wacore-appstate" }
wacore-binary = { path = "src/check/wacore-binary" }
wacore-derive = { path = "src/check/wacore-derive" }
wacore-libsignal = { path = "src/check/wacore-libsignal" }
wacore-noise = { path = "src/check/wacore-noise" }
wacore-voip = { path = "src/check/wacore-voip" }
waproto = { path = "src/check/waproto" }
yoke = { version = "=0.7.5", features = ["derive"] }
zlib-rs = { version = "0.6.6", default-features = false, features = ["std", "rust-allocator"] }

[patch.crates-io]
smoothutf8 = { path = "compat/smoothutf8" }

[lib]
crate-type = ["cdylib"]

[dependencies]
signal_proto = { path = "../signalProto" }
napi = { version = "3.12.2", features = ["full"] }
napi-derive = "3.6.3"
wacore-binary = { workspace = true }
wacore-noise = { workspace = true }
wacore-libsignal = { workspace = true }
wacore-voip = { workspace = true }
curve25519-dalek = "4"
ed25519-dalek = "2"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
subtle = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
prost = "0.14.4"
thiserror = "2.0.21"
x25519-dalek = "3.0.0"
getrandom = "0.2"
rayon = "1"

[build-dependencies]
napi-build = "2.4.1"

[profile.release]
lto = true
strip = "symbols"
