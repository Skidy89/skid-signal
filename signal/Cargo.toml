[package]
name = "signal"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
signal_proto = { path = "../signalProto" }
napi = { version = "3.12.2", features = ["full"] }
napi-derive = "3.6.3"
curve25519-dalek = "4"
ed25519-dalek = "2"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
subtle = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
prost = "0.14.4"
thiserror = "2.0.21"
x25519-dalek = "3.0.0"
getrandom = "0.2"
rayon = "1"

[build-dependencies]
napi-build = "2.4.1"

[profile.release]
lto = true
strip = "symbols"
